# Koyeb deployment config for ZRG Oblivion Bot with SQLite persistence
# Внимание: на бесплатном тарифе Koyeb нет постоянных дисков - данные будут теряться при редеплое!
# Для сохранения данных:
# 1. Используй Koyeb Volumes (требует платный тариф) или
# 2. Деплой на Amvera/Render где есть persistent disk
# 3. Или добавь env BACKUP_CHAT_ID и бот будет слать бэкапы в ТГ

name: zrg-oblivion-bot
services:
  - name: bot
    type: worker
    git:
      branch: main
    build:
      builder: buildpack
      build_command: pip install -r requirements.txt
    run_command: python bot.py
    env:
      - key: BOT_TOKEN
        value: ""
      - key: ADMIN_IDS
        value: ""
      - key: CLAN_NAME
        value: ZRG OBLIVION
      - key: DATA_DIR
        value: /data
      - key: CLAN_MEMBERS
        value: "59"
    # volumes: # раскомментируй если есть платный тариф Koyeb
    #   - path: /data
    #     name: zrg-data
    #     size: 1GB
